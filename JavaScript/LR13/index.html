<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР №13</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <section class="catalog-container">
        <header class="catalog-header">
            <h1 class="catalog-title" id="catalog-title">ОБОВ'ЯЗКОВО ДОДАЙТЕ СВОЄ ЗАМОВЛЕННЯ</h1>
            <div class="cart-icon-wrapper" id="cart-icon">
                <img src="styles/images/cart.svg" alt="Корзина" class="cart-icon-img" width="28" height="28">
                <span class="cart-badge" id="cart-badge">0</span>
            </div>
        </header>
        <p id="load-status" class="load-status" role="status" aria-live="polite">Завантаження товарів...</p>

        <div class="product-grid" id="product-container"></div>
    </section>

    <div class="modal-overlay" id="qty-modal">
        <div class="modal-content">
            <h3>Вкажіть кількість:</h3>
            <p id="modal-product-title" class="modal-product-title"></p>
            <input type="number" id="product-qty-input" value="1" min="1" max="99">
            <div class="modal-buttons">
                <button class="btn buy" id="confirm-add-btn">ДОДАТИ ДО КОРЗИНИ</button>
                <button class="btn coming-soon" id="cancel-qty-btn">СКАСУВАТИ</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="success-modal">
        <div class="modal-content">
            <h3>Товар додано</h3>
            <div class="modal-buttons modal-buttons-margin">
                <button class="btn buy" id="goto-cart-modal-btn">ПЕРЕЙТИ У КОРЗИНУ</button>
                <button class="btn coming-soon" id="continue-shopping-btn">ПОВЕРНУТИСЬ ДО ПОКУПОК</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="empty-cart-modal">
        <div class="modal-content">
            <h3>Корзина пуста</h3>
            <div class="modal-buttons modal-buttons-margin">
                <button class="btn buy" id="close-empty-modal-btn">ОК</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
