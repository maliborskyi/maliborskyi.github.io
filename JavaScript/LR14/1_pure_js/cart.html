<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик замовлень — i18n</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <section class="catalog-container cart-page-container">
        <div class="catalog-header">
            <h1 class="catalog-title cart-page-title"
                data-i18n="cartPageTitle">Кошик замовлень</h1>

            <label class="language-control" for="language-selector">
                <span data-i18n="selectLanguage">Мова</span>
                <select id="language-selector" aria-label="Мова / Language">
                    <option value="uk">Українська</option>
                    <option value="en">English</option>
                </select>
            </label>
        </div>

        <div id="cart-content-area"></div>
    </section>

    <div class="modal-overlay language-modal" id="language-modal"
         role="dialog" aria-modal="true"
         aria-labelledby="language-modal-title">
        <div class="modal-content">
            <h3 id="language-modal-title">Оберіть мову / Choose language</h3>
            <p class="language-hint">
                Виберіть мову перегляду / Select your language
            </p>

            <div class="modal-buttons">
                <button class="btn buy language-choice"
                        type="button" data-language="uk">Українська</button>
                <button class="btn coming-soon language-choice"
                        type="button" data-language="en">English</button>
            </div>

            <p id="language-error" class="load-status" role="alert"></p>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/cart.js"></script>
</body>

</html>
